<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Explosion 3D</title>
  <link rel="stylesheet" href="app.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/three.module.min.js",
        "three/addons/": "./vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <main class="app">
    <section class="panel chat" aria-label="Designer chat" id="chat-panel">
      <header class="panel-head chat-head">
        <div class="head-row">
          <select id="project-switch" class="project-switch" aria-label="Your projects"></select>
          <button class="small ghost" id="new-project" type="button">New</button>
          <button class="small ghost danger" id="delete-project" type="button">Delete</button>
        </div>
        <span class="save-status" id="save-status">Not saved yet</span>
      </header>
      <div class="confirm" id="confirm" hidden>
        <span id="confirm-text"></span>
        <button class="small danger" id="confirm-yes" type="button">Yes, delete it</button>
        <button class="small ghost" id="confirm-no" type="button">Keep it</button>
      </div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <div class="drop-hint" id="drop-hint" hidden>Drop a photo to share it</div>
      <form class="composer" id="composer">
        <div class="attachments" id="attachments" hidden></div>
        <div class="composer-row">
          <button class="icon ghost" id="attach" type="button" title="Add a photo" aria-label="Add a photo">📷</button>
          <textarea id="prompt" rows="2" placeholder="Tell me what you'd like to make…"></textarea>
          <button type="submit" id="send">Send</button>
        </div>
        <input type="file" id="file-input" accept="image/*" multiple hidden>
      </form>
    </section>

    <section class="panel viewer" aria-label="3D preview">
      <div class="stage" id="stage"></div>
      <div class="viewer-empty" id="viewer-empty">Your design will show up here.</div>
      <div class="busy" id="busy" hidden><span class="spinner"></span><span id="busy-text">Working…</span></div>
      <div class="viewer-hint" id="viewer-hint">Click the model to pause spinning</div>
      <div class="viewer-controls">
        <label>Zoom <input type="range" id="zoom" min="0.5" max="2.5" step="0.01" value="1"></label>
        <label>Angle <input type="range" id="angle" min="5" max="85" step="1" value="28"></label>
      </div>
    </section>

    <section class="panel params" aria-label="Adjust the design">
      <header class="panel-head"><h2>Adjust</h2></header>
      <div class="param-list" id="param-list">
        <p class="empty">Once there's a design, its sizes and options show up here.</p>
      </div>
      <footer class="actions">
        <p class="stale" id="stale" hidden>You changed something. Press Update to see it.</p>
        <button id="generate" disabled>Update the model</button>
        <button id="export" disabled>Save for printing (STL)</button>
        <button id="bambu" disabled>Open in Bambu Studio</button>
      </footer>
    </section>
  </main>
  <footer class="statusbar" id="statusbar">Connecting…</footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
